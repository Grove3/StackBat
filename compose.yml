version: '3.8'
services:
  flight_controller:
    image: flight/controller:latest
    container_name: flight_controller_1
    ports:
    - 8080:8080
    environment:
    - FLIGHT_MODE=auto
    - LOG_LEVEL=INFO
    - INSTANCE_ID=1
    volumes:
    - flight_logs:/var/log/flight
    - flight_config:/etc/flight
    networks:
    - flight_network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
  flight_telemetry:
    image: flight/telemetry:latest
    container_name: flight_telemetry_1
    ports:
    - 8081:8081
    environment:
    - TELEMETRY_RATE=10
    - DATA_FORMAT=json
    depends_on:
    - flight_controller
    volumes:
    - flight_data:/var/data/telemetry
    networks:
    - flight_network
    restart: unless-stopped
  hatp_processor:
    image: hatp/processor:latest
    container_name: hatp_processor_1
    ports:
    - 9090:9090
    environment:
    - HATP_CONFIG=~/test
    - PROCESSING_THREADS=4
    - BUFFER_SIZE=1024
    - LOG_LEVEL=INFO
    volumes:
    - hatp_data:/data
    - hatp_config:/config
    - hatp_logs:/var/log/hatp
    networks:
    - hatp_network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - hatp-health-check
      interval: 30s
      timeout: 10s
      retries: 3
  hatp_gateway:
    image: hatp/gateway:latest
    container_name: hatp_gateway_1
    ports:
    - 9091:9091
    - 9092:9092
    environment:
    - GATEWAY_MODE=cluster
    - MAX_CONNECTIONS=1000
    - TIMEOUT=30
    depends_on:
    - hatp_processor
    volumes:
    - hatp_gateway_config:/etc/gateway
    networks:
    - hatp_network
    restart: unless-stopped
  hatp_monitor:
    image: hatp/monitor:latest
    container_name: hatp_monitor_1
    ports:
    - 9093:9093
    environment:
    - MONITOR_INTERVAL=5
    - ALERT_THRESHOLD=80
    - METRICS_RETENTION=7d
    depends_on:
    - hatp_processor
    - hatp_gateway
    volumes:
    - hatp_metrics:/var/metrics
    networks:
    - hatp_network
    restart: unless-stopped
  mission_planner:
    image: mission/planner:latest
    container_name: mission_planner_1
    ports:
    - 7070:7070
    environment:
    - MISSION_MODE=planning
    - PLANNING_ALGORITHM=astar
    - MAX_WAYPOINTS=1000
    - SAFETY_MARGIN=10.0
    volumes:
    - mission_plans:/var/plans
    - mission_maps:/var/maps
    - mission_config:/etc/mission
    networks:
    - mission_network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:7070/health
      interval: 30s
      timeout: 10s
      retries: 3
  mission_executor:
    image: mission/executor:latest
    container_name: mission_executor_1
    ports:
    - 7071:7071
    environment:
    - EXECUTION_MODE=automatic
    - CHECKPOINT_INTERVAL=30
    - RECOVERY_STRATEGY=rollback
    depends_on:
    - mission_planner
    volumes:
    - mission_plans:/var/plans:ro
    - mission_state:/var/state
    - mission_logs:/var/log/mission
    networks:
    - mission_network
    restart: unless-stopped
  mission_monitor:
    image: mission/monitor:latest
    container_name: mission_monitor_1
    ports:
    - 7072:7072
    environment:
    - MONITOR_FREQUENCY=1
    - ALERT_ENABLED=true
    - DASHBOARD_ENABLED=true
    depends_on:
    - mission_planner
    - mission_executor
    volumes:
    - mission_state:/var/state:ro
    - mission_logs:/var/log/mission:ro
    networks:
    - mission_network
    restart: unless-stopped
  mission_database:
    image: postgres:13
    container_name: mission_db_1
    ports:
    - 5432:5432
    environment:
    - POSTGRES_DB=mission_db
    - POSTGRES_USER=mission_user
    - POSTGRES_PASSWORD=mission_pass
    volumes:
    - mission_db_data:/var/lib/postgresql/data
    networks:
    - mission_network
    restart: unless-stopped
networks:
  flight_network:
    driver: bridge
    ipam:
      config:
      - subnet: 172.20.0.0/16
  hatp_network:
    driver: bridge
    attachable: true
    ipam:
      config:
      - subnet: 172.21.0.0/16
  mission_network:
    driver: bridge
    ipam:
      config:
      - subnet: 172.22.0.0/16
volumes:
  flight_logs:
    driver: local
  flight_config:
    driver: local
  flight_data:
    driver: local
  hatp_data:
    driver: local
  hatp_config:
    driver: local
  hatp_logs:
    driver: local
  hatp_gateway_config:
    driver: local
  hatp_metrics:
    driver: local
  mission_plans:
    driver: local
  mission_maps:
    driver: local
  mission_config:
    driver: local
  mission_state:
    driver: local
  mission_logs:
    driver: local
  mission_db_data:
    driver: local
